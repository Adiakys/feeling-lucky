# Publishing a GitHub release, or pre-release, on a v<version> tag publishes the package to npm and attaches
# it to the release, the multiplayer server to NuGet and its image to GitHub's container registry; a release also
# deploys the playground as the demo on GitHub Pages. A pre-release goes to npm under the `next` dist-tag and to the
# registry without `latest`, so installs keep getting the latest release.
name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm 11.5+ publishes through npm's Trusted Publishing (OIDC) once it is set up on npmjs.com; until then, with NPM_TOKEN.
      - run: npm install -g npm@latest
      - run: npm ci
      # The version is the release's tag, v1.2.3 or v1.2.3-beta.1: package.json's is only a placeholder.
      - name: Version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm pack
      - run: gh release upload "$GITHUB_REF_NAME" adiakys-feeling-lucky-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
      - if: ${{ !github.event.release.prerelease }}
        run: npm run build:demo
      - if: ${{ !github.event.release.prerelease }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet test server/FeelingLucky.slnx
      - run: dotnet pack server/src/FeelingLucky -c Release -p:Version=${{ steps.version.outputs.version }} -o packages
      - run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/src/FeelingLucky.Host/Dockerfile
          push: true
          tags: |
            ghcr.io/adiakys/feeling-lucky-server:${{ steps.version.outputs.version }}
            ${{ !github.event.release.prerelease && 'ghcr.io/adiakys/feeling-lucky-server:latest' || '' }}

  pages:
    needs: release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
