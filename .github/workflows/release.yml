# Publishing a GitHub release, or pre-release, on a v<version> tag publishes the package to npm and attaches
# it to the release; a release also deploys the playground as the demo on GitHub Pages. A pre-release goes to
# npm under the `next` dist-tag, so `npm install` keeps getting the latest release.
name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm 11.5+ publishes through npm's Trusted Publishing (OIDC) once it is set up on npmjs.com; until then, with NPM_TOKEN.
      - run: npm install -g npm@latest
      - run: npm ci
      # The version is the release's tag, v1.2.3 or v1.2.3-beta.1: package.json's is only a placeholder.
      - name: Version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm pack
      - run: gh release upload "$GITHUB_REF_NAME" adiakys-feeling-lucky-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
      - if: ${{ !github.event.release.prerelease }}
        run: npm run build:demo
      - if: ${{ !github.event.release.prerelease }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
