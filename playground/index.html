<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>feeling-lucky playground</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; font: 15px system-ui, sans-serif; background: #f4f1ea; color: #222; }
      button, select { font: inherit; padding: 8px 14px; }
    </style>
  </head>
  <body>
    <button id="open">Feeling lucky</button>
    <label>Language <select id="lang"><option>en</option><option>it</option><option>es</option><option>fr</option><option>de</option></select></label>
    <label>Logo <select id="logo"><option value="">Clover</option><option value="acme">Acme</option></select></label>
    <label>Prizes <select id="count"><option value="3">3</option><option value="1">1</option><option value="6">6</option></select></label>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
